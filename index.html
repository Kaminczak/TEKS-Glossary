    <!-- Fonts are @imported from index.css; warming the connection shaves the first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />

    <script>
      // Other half of the GitHub Pages SPA shim in public/404.html: a deep link
      // like /teks/110.36/1B arrives here as /?/teks/110.36/1B (query params
      // joined with ~and~). Put the real URL back before the app reads it.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) { return s.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
