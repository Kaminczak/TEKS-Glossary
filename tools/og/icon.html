<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>icon</title>
<style>
  /* 180x180 apple-touch-icon (also downscaled to favicon.ico by render.py).
     Square on purpose — iOS applies its own mask. Same K mark as public/favicon.svg. */
  html, body { margin: 0; padding: 0; }
  body { width: 180px; height: 180px; overflow: hidden; background: #602400; display: flex; align-items: center; justify-content: center; }
  svg { width: 132px; height: 132px; display: block; }
</style>
</head>
<body>
  <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 6v20M23 6L12 16l11 10" fill="none" stroke="#F6F2EC" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</body>
</html>
